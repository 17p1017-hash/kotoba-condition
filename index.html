<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ことばの調子記録</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      background: #fffaf4;
      color: #4a4744;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 4px 0 8px;
      font-size: 28px;
      color: #4d5f6d;
      letter-spacing: 0.04em;
    }

    .subtitle {
      color: #8a817a;
      font-size: 14px;
      line-height: 1.7;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #f0e7dd;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 6px 20px rgba(120, 105, 90, 0.07);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .card-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #eef4f1;
      font-size: 17px;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      color: #55514d;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #625d58;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #e3ddd5;
      border-radius: 15px;
      background: #fffdfa;
      color: #4a4744;
      font-size: 17px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #91aaa2;
      box-shadow: 0 0 0 3px rgba(145, 170, 162, 0.14);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 22px;
    }

    .person-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 9px;
      align-items: center;
    }

    button {
      min-height: 46px;
      border: none;
      border-radius: 15px;
      padding: 10px 15px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-button {
      background: #eaf2ef;
      color: #557069;
    }

    .danger-button {
      background: #fff0ed;
      color: #a45e59;
    }

    .save-button {
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      background: #799b91;
      color: white;
      font-size: 18px;
      letter-spacing: 0.03em;
      box-shadow:
        0 5px 12px rgba(91, 124, 114, 0.16);
    }

    .score-block {
      padding: 17px;
      border-radius: 19px;
      background: #fcfaf6;
      border: 1px solid #f0e8df;
      margin-bottom: 18px;
    }

    .score-title {
      margin-bottom: 12px;
      font-size: 17px;
      color: #5c5752;
    }

    .score-guide {
      margin-top: 4px;
      color: #9a9189;
      font-size: 12px;
      font-weight: normal;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
    }

    .score-button {
      aspect-ratio: 1.25 / 1;
      min-height: 48px;
      padding: 6px;
      border: 1px solid #e3e1dc;
      border-radius: 16px;
      background: #ffffff;
      color: #69635e;
      font-size: 18px;
      box-shadow:
        0 2px 7px rgba(100, 90, 80, 0.05);
    }

    .score-button.selected {
      border-color: #799b91;
      background: #799b91;
      color: white;
      box-shadow:
        0 4px 10px rgba(91, 124, 114, 0.18);
    }

    .score-value {
      min-height: 25px;
      margin-top: 11px;
      text-align: center;
      color: #71877f;
      font-weight: 700;
    }

    .message {
      min-height: 24px;
      margin-top: 13px;
      text-align: center;
      font-weight: 700;
      line-height: 1.5;
    }

    .small-note {
      color: #8a817a;
      font-size: 13px;
      line-height: 1.8;
    }

    .soft-line {
      height: 1px;
      margin: 20px 0;
      background: #f1ebe4;
    }

    @media (max-width: 540px) {
      .app {
        padding: 18px 13px 40px;
      }

      h1 {
        font-size: 24px;
      }

      .card {
        padding: 17px;
        border-radius: 21px;
      }

      .person-row {
        grid-template-columns: 1fr 1fr;
      }

      .person-row select {
        grid-column: 1 / -1;
      }

      .score-grid {
        gap: 7px;
      }

      .score-button {
        min-height: 46px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <h1>ことばの調子記録</h1>

      <div class="subtitle">
        今日の話す調子と心の調子を<br>
        ゆっくり記録していきましょう
      </div>

    </header>


    <section class="card">

      <div class="card-title">

        <div class="card-icon">
          👤
        </div>

        <h2>
          利用者
        </h2>

      </div>


      <div class="person-row">

        <select id="personSelect">

          <option value="">
            利用者を選んでください
          </option>

        </select>


        <button
          id="addPersonButton"
          class="secondary-button"
          type="button"
        >
          ＋ 追加
        </button>


        <button
          id="deletePersonButton"
          class="danger-button"
          type="button"
        >
          削除
        </button>

      </div>

    </section>


    <section class="card">

      <div class="card-title">

        <div class="card-icon">
          ✏️
        </div>

        <h2>
          今日の記録
        </h2>

      </div>


      <div class="field">

        <label for="recordDate">
          日付
        </label>

        <input
          id="recordDate"
          type="date"
        >

      </div>


      <div class="score-block">

        <div class="score-title">

          <strong>
            吃音の調子
          </strong>

          <div class="score-guide">
            1〜10から選びます
          </div>

        </div>

        <div
          id="stutterButtons"
          class="score-grid"
        ></div>

        <div
          id="stutterValue"
          class="score-value"
        >
          未選択
        </div>

      </div>


      <div class="score-block">

        <div class="score-title">

          <strong>
            心の調子
          </strong>

          <div class="score-guide">
            1〜10から選びます
          </div>

        </div>

        <div
          id="moodButtons"
          class="score-grid"
        ></div>

        <div
          id="moodValue"
          class="score-value"
        >
          未選択
        </div>

      </div>


      <div class="field">

        <label for="memo">
          メモ
        </label>

        <textarea
          id="memo"
          placeholder="今日の出来事や、話した場面などを自由に記録できます"
        ></textarea>

      </div>


      <button
        id="saveButton"
        class="save-button"
        type="button"
      >
        記録する
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </section>


    <section class="card">

      <div class="card-title">

        <div class="card-icon">
          🌿
        </div>

        <h2>
          記録について
        </h2>

      </div>

      <div class="small-note">
        記録はこの端末のブラウザ内に保存されます。
        利用者ごとに記録を分けて管理できます。
      </div>

      <div class="soft-line"></div>

      <div class="small-note">
        次の段階では、過去の記録や月平均、
        調子の変化が分かるグラフも追加できます。
      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
